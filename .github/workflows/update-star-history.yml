name: Update star history

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Test before refresh
        run: npm test
      - name: Refresh cache
        run: node scripts/update-star-history.mjs
      - name: Validate generated cache
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          await import("./star-history.js");
          globalThis.StarHistory.normalizeCache(JSON.parse(await readFile("star-history.json", "utf8")));
          NODE
          git diff --check -- star-history.json
      - name: Commit changed cache
        shell: bash
        run: |
          if git diff --quiet -- star-history.json; then exit 0; fi
          git add -- star-history.json
          if git grep --cached -qE '(gh[pousr]_[[:alnum:]_]{20,}|github_pat_[[:alnum:]_]{20,}|AIza[[:alnum:]_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- star-history.json; then
            echo "::error::Potential secret detected in star-history.json"
            exit 1
          else
            scan_status=$?
            if [ "$scan_status" -ne 1 ]; then
              echo "::error::Secret scan failed"
              exit 1
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update star history cache"
          git push origin HEAD:main
