name: Redeploy finalized Pages artifact

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Bind deployment to exact origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          SOURCE_SHA="$(git rev-parse HEAD)"
          [ "$SOURCE_SHA" = "$(git rev-parse refs/remotes/origin/main)" ] || { echo "::error::checkout is not exact origin/main"; exit 1; }
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Build committed Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          # Exit 3 is the store's one benign verdict: nothing is tracked at this commit. Every other
          # non-zero exit is a real fault - a commit carrying both pointer and blob, a corrupt
          # pointer, git failing - and answering it with the legacy v0 build would deploy a stale
          # site over a broken database, so the step is guarded rather than run under `if`.
          set +e
          node scripts/observation-db-store.mjs resolve --source-sha "$SOURCE_SHA" --check
          CHECK_STATUS=$?
          set -e
          case "$CHECK_STATUS" in
            0)
              SNAPSHOT_ID="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const value=JSON.parse(readFileSync("data/latest.json","utf8")); if(!/^[0-9]{14}-[a-f0-9]{16}$/.test(value.snapshotId??"")) throw new Error("committed snapshot id is invalid"); process.stdout.write(value.snapshotId);')"
              rm -f "${RUNNER_TEMP}/repository-observations.sqlite"
              node scripts/observation-db-store.mjs resolve --source-sha "$SOURCE_SHA" --expect-snapshot-id "$SNAPSHOT_ID" --out "${RUNNER_TEMP}/repository-observations.sqlite"
              ARTIFACT_CONTRACT="${RUNNER_TEMP}/artifact-contract.json"
              python scripts/derive_repository_artifacts.py export-contract --database "${RUNNER_TEMP}/repository-observations.sqlite" --snapshot-id "$SNAPSHOT_ID" --contract-out "$ARTIFACT_CONTRACT"
              node scripts/build-pages-artifact.mjs --source "." --out "${RUNNER_TEMP}/pages-artifact" --source-sha "$SOURCE_SHA" --snapshot-id "$SNAPSHOT_ID" --artifact-contract "$ARTIFACT_CONTRACT"
              node scripts/probe-production.mjs --artifact-dir "${RUNNER_TEMP}/pages-artifact" --source-sha "$SOURCE_SHA" --snapshot-id "$SNAPSHOT_ID" --artifact-contract "$ARTIFACT_CONTRACT"
              echo "DEPLOYMENT_MODE=v1" >> "$GITHUB_ENV"
              echo "SNAPSHOT_ID=$SNAPSHOT_ID" >> "$GITHUB_ENV"
              echo "ARTIFACT_CONTRACT=$ARTIFACT_CONTRACT" >> "$GITHUB_ENV"
              ;;
            3)
              node scripts/build-pages-artifact.mjs --mode legacy --source "." --out "${RUNNER_TEMP}/pages-artifact" --source-sha "$SOURCE_SHA"
              node scripts/probe-production.mjs --artifact-dir "${RUNNER_TEMP}/pages-artifact" --legacy-recovery-sha "$SOURCE_SHA"
              echo "DEPLOYMENT_MODE=v0" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::observation database check failed (exit $CHECK_STATUS)"
              exit 1
              ;;
          esac
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-artifact
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Probe deployed Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DEPLOYMENT_MODE" = "v1" ]; then
            node scripts/probe-production.mjs --base-url "${{ steps.deployment.outputs.page_url }}" --source-sha "$SOURCE_SHA" --snapshot-id "$SNAPSHOT_ID" --artifact-contract "$ARTIFACT_CONTRACT"
          else
            node scripts/probe-production.mjs --base-url "${{ steps.deployment.outputs.page_url }}" --legacy-recovery-sha "$SOURCE_SHA"
          fi
