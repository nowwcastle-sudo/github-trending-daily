name: Trending refresh (every 6 hours)

on:
  schedule:
    - cron: "7 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      bootstrap-source-sha:
        description: Verified Pages source SHA for the first version-0 bootstrap only
        required: false
        type: string

permissions: {}

concurrency:
  group: daily-refresh
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: https://nowwcastle-sudo.github.io/github-trending-daily/
  MANUAL_BOOTSTRAP_GATE: bootstrap_v0_approved
  REQUESTED_BOOTSTRAP_SOURCE_SHA: ${{ inputs['bootstrap-source-sha'] || '' }}

jobs:
  prepare:
    if: ${{ (github.event_name == 'schedule' && vars.GH_TRENDING_REFRESH_SCHEDULE == 'enabled') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      original_sha: ${{ steps.state.outputs.original_sha }}
      snapshot_id: ${{ steps.context.outputs.snapshot_id }}
      recovery_version: ${{ steps.state.outputs.recovery_version }}
      recovery_source_sha: ${{ steps.state.outputs.hydration_source_sha }}
      recovery_snapshot_id: ${{ steps.state.outputs.parent_snapshot_id }}
      production_version: ${{ steps.state.outputs.production_version }}
      production_manifest_status: ${{ steps.state.outputs.production_manifest_status }}
      production_manifest_sha256: ${{ steps.state.outputs.production_manifest_sha256 }}
      enrichment_budget_mode: ${{ steps.state.outputs.enrichment_budget_mode }}
      manual_bootstrap_source_sha: ${{ steps.state.outputs.manual_bootstrap_source_sha }}
      verified_bootstrap_source_sha: ${{ steps.state.outputs.hydration_source_sha }}
      frozen_source_set_sha256: ${{ steps.facts.outputs.source_set_sha256 }}
      frozen_run_context_sha256: ${{ steps.facts.outputs.run_context_sha256 }}
      enrichment_deadline_epoch_ms: ${{ steps.events.outputs.enrichment_deadline_epoch_ms }}
      refresh_hard_deadline_epoch_ms: ${{ steps.clock.outputs.hard_deadline_epoch_ms }}
    steps:
      - name: Anchor immutable refresh clock and gates
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_BOOTSTRAP_GATE" = "bootstrap_v0_pending_approval" ]; then
            echo "::error::Manual bootstrap remains pending explicit approval"
            exit 1
          fi
          REFRESH_ORIGIN_EPOCH_MS="$(printf '%s' "$EPOCHREALTIME" | tr -d '.' | cut -c1-13)"
          echo "REFRESH_ORIGIN_EPOCH_MS=$REFRESH_ORIGIN_EPOCH_MS" >> "$GITHUB_ENV"
          echo "EVENT_ORIGIN_EPOCH_MS=$REFRESH_ORIGIN_EPOCH_MS" >> "$GITHUB_ENV"
          echo "REFRESH_HARD_DEADLINE_EPOCH_MS=$(( 10#$REFRESH_ORIGIN_EPOCH_MS + 6900000 ))" >> "$GITHUB_ENV"
          echo "REFRESH_EVENT_DEADLINE_EPOCH_MS=$(( 10#$REFRESH_ORIGIN_EPOCH_MS + 900000 ))" >> "$GITHUB_ENV"
          echo "REFRESH_TEARDOWN_CUSHION_MS=300000" >> "$GITHUB_ENV"
          echo "hard_deadline_epoch_ms=$(( 10#$REFRESH_ORIGIN_EPOCH_MS + 6900000 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: npm ci
      - name: Test before refresh
        run: npm test
      - name: Resolve verified production state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          [ "$ORIGINAL_SHA" = "$(git rev-parse refs/remotes/origin/main)" ] || { echo "::error::checkout is not exact origin/main"; exit 1; }
          MANIFEST_FILE="${RUNNER_TEMP}/production-manifest.json"
          HTTP_STATUS="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --max-filesize 1048576 --output "$MANIFEST_FILE" --write-out '%{http_code}' "${PRODUCTION_BASE_URL}deployment-manifest.json?preflight=${GITHUB_RUN_ID}")"
          if [ -n "$REQUESTED_BOOTSTRAP_SOURCE_SHA" ] && [[ ! "$REQUESTED_BOOTSTRAP_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::requested bootstrap source SHA is invalid"
            exit 1
          fi
          FALLBACK_SOURCE_SHA="$ORIGINAL_SHA"
          if [ "$HTTP_STATUS" = "404" ]; then
            [ -n "$REQUESTED_BOOTSTRAP_SOURCE_SHA" ] || { echo "::error::verified-404 bootstrap requires an explicit source SHA"; exit 1; }
            FALLBACK_SOURCE_SHA="$REQUESTED_BOOTSTRAP_SOURCE_SHA"
          fi
          STATE_FILE="${RUNNER_TEMP}/production-state.json"
          node scripts/build-pages-artifact.mjs --inspect-manifest "$MANIFEST_FILE" --http-status "$HTTP_STATUS" --fallback-source-sha "$FALLBACK_SOURCE_SHA" > "$STATE_FILE"
          export ORIGINAL_SHA STATE_FILE
          node --input-type=module -e 'import { appendFileSync, readFileSync } from "node:fs"; import { parseJsonStrict } from "./scripts/build-pages-artifact.mjs"; const value=parseJsonStrict(readFileSync(process.env.STATE_FILE),"verified production state",1024*1024); const keys=["manifestSha256","manifestStatus","snapshotId","sourceSha","version"]; if(Object.keys(value).sort().join("\\0")!==keys.sort().join("\\0")) throw new Error("invalid production state"); appendFileSync(process.env.GITHUB_OUTPUT,`hydration_source_sha=${value.sourceSha}\nproduction_version=${value.version}\nparent_snapshot_id=${value.snapshotId ?? ""}\nrecovery_version=${value.version}\noriginal_sha=${process.env.ORIGINAL_SHA}\n`); appendFileSync(process.env.GITHUB_ENV,`HYDRATION_SOURCE_SHA=${value.sourceSha}\nPRODUCTION_MANIFEST_STATUS=${value.manifestStatus}\nPRODUCTION_MANIFEST_SHA256=${value.manifestSha256 ?? ""}\nPRODUCTION_VERSION=${value.version}\nPARENT_SNAPSHOT_ID=${value.snapshotId ?? ""}\nINPUT_SOURCE_SHA=${process.env.ORIGINAL_SHA}\n`);'
          HYDRATION_SOURCE_SHA="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1],"utf8")); process.stdout.write(value.sourceSha);' "$STATE_FILE")"
          PRODUCTION_VERSION="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1],"utf8")); process.stdout.write(String(value.version));' "$STATE_FILE")"
          PRODUCTION_MANIFEST_STATUS="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1],"utf8")); process.stdout.write(value.manifestStatus);' "$STATE_FILE")"
          PRODUCTION_MANIFEST_SHA256="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1],"utf8")); process.stdout.write(value.manifestSha256 ?? "");' "$STATE_FILE")"
          echo "production_manifest_status=$PRODUCTION_MANIFEST_STATUS" >> "$GITHUB_OUTPUT"
          echo "production_manifest_sha256=$PRODUCTION_MANIFEST_SHA256" >> "$GITHUB_OUTPUT"
          git cat-file -e "${HYDRATION_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$HYDRATION_SOURCE_SHA" "$ORIGINAL_SHA"
          if [ "$PRODUCTION_VERSION" = "0" ]; then
            [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { echo "::error::migration baseline requires the approved manual gate"; exit 1; }
            if node scripts/observation-db-store.mjs resolve --source-sha "$HYDRATION_SOURCE_SHA" --check; then
              echo "::error::v0 production cannot carry the canonical repository database"
              exit 1
            fi
            echo "ENRICHMENT_BUDGET_MODE=$MANUAL_BOOTSTRAP_GATE" >> "$GITHUB_ENV"
            echo "enrichment_budget_mode=$MANUAL_BOOTSTRAP_GATE" >> "$GITHUB_OUTPUT"
            echo "VERIFIED_RECOVERY_VERSION=0" >> "$GITHUB_ENV"
            echo "VERIFIED_BOOTSTRAP_SOURCE_SHA=$HYDRATION_SOURCE_SHA" >> "$GITHUB_ENV"
            if [ "$PRODUCTION_MANIFEST_STATUS" = "verified_404" ]; then
              [ -n "$REQUESTED_BOOTSTRAP_SOURCE_SHA" ] || { echo "::error::verified-404 bootstrap requires an explicit source SHA"; exit 1; }
              [ "$REQUESTED_BOOTSTRAP_SOURCE_SHA" = "$HYDRATION_SOURCE_SHA" ] || { echo "::error::requested bootstrap source does not match verified Pages source"; exit 1; }
              echo "MANUAL_BOOTSTRAP_SOURCE_SHA=$REQUESTED_BOOTSTRAP_SOURCE_SHA" >> "$GITHUB_ENV"
              echo "manual_bootstrap_source_sha=$REQUESTED_BOOTSTRAP_SOURCE_SHA" >> "$GITHUB_OUTPUT"
              node scripts/probe-production.mjs --base-url "$PRODUCTION_BASE_URL" --bootstrap-preflight-sha "$HYDRATION_SOURCE_SHA"
            elif [ "$PRODUCTION_MANIFEST_STATUS" = "verified_v0" ]; then
              [ -z "$REQUESTED_BOOTSTRAP_SOURCE_SHA" ] || { echo "::error::verified-v0 manifest bootstrap forbids an explicit source SHA"; exit 1; }
              echo "MANUAL_BOOTSTRAP_SOURCE_SHA=$HYDRATION_SOURCE_SHA" >> "$GITHUB_ENV"
              echo "manual_bootstrap_source_sha=$HYDRATION_SOURCE_SHA" >> "$GITHUB_OUTPUT"
              node scripts/probe-production.mjs --base-url "$PRODUCTION_BASE_URL" --legacy-recovery-sha "$HYDRATION_SOURCE_SHA"
            else
              echo "::error::invalid migration manifest evidence"
              exit 1
            fi
          else
            [ -z "$REQUESTED_BOOTSTRAP_SOURCE_SHA" ] || { echo "::error::version-1 refresh forbids a bootstrap source SHA"; exit 1; }
            node scripts/observation-db-store.mjs resolve --source-sha "$HYDRATION_SOURCE_SHA" --check
            PARENT_SNAPSHOT_ID="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1],"utf8")); process.stdout.write(value.snapshotId ?? "");' "$STATE_FILE")"
            [ -n "$PARENT_SNAPSHOT_ID" ]
            echo "ENRICHMENT_BUDGET_MODE=normal" >> "$GITHUB_ENV"
            echo "enrichment_budget_mode=normal" >> "$GITHUB_OUTPUT"
            echo "manual_bootstrap_source_sha=" >> "$GITHUB_OUTPUT"
            echo "VERIFIED_RECOVERY_VERSION=1" >> "$GITHUB_ENV"
            echo "VERIFIED_BOOTSTRAP_SOURCE_SHA=$HYDRATION_SOURCE_SHA" >> "$GITHUB_ENV"
            node scripts/probe-production.mjs --base-url "$PRODUCTION_BASE_URL" --source-sha "$HYDRATION_SOURCE_SHA" --snapshot-id "$PARENT_SNAPSHOT_ID"
          fi
      - name: Build verified recovery artifact
        shell: bash
        env:
          HYDRATION_SOURCE_SHA: ${{ steps.state.outputs.hydration_source_sha }}
          PRODUCTION_VERSION: ${{ steps.state.outputs.production_version }}
          PARENT_SNAPSHOT_ID: ${{ steps.state.outputs.parent_snapshot_id }}
        run: |
          set -euo pipefail
          RECOVERY_SOURCE="${RUNNER_TEMP}/recovery-source"
          mkdir "$RECOVERY_SOURCE"
          git archive --format=tar "$HYDRATION_SOURCE_SHA" | tar -x -C "$RECOVERY_SOURCE"
          if [ "$PRODUCTION_VERSION" = "0" ]; then
            node scripts/build-pages-artifact.mjs --mode legacy --source "$RECOVERY_SOURCE" --out "${RUNNER_TEMP}/recovery-artifact" --source-sha "$HYDRATION_SOURCE_SHA"
            node scripts/probe-production.mjs --artifact-dir "${RUNNER_TEMP}/recovery-artifact" --legacy-recovery-sha "$HYDRATION_SOURCE_SHA"
          else
            rm -f "$RECOVERY_SOURCE/data/repository-observations.sqlite"
            node scripts/observation-db-store.mjs resolve --source-sha "$HYDRATION_SOURCE_SHA" --expect-snapshot-id "$PARENT_SNAPSHOT_ID" --out "$RECOVERY_SOURCE/data/repository-observations.sqlite"
            RECOVERY_CONTRACT="${RUNNER_TEMP}/recovery-artifact-contract.json"
            python scripts/derive_repository_artifacts.py export-contract --database "$RECOVERY_SOURCE/data/repository-observations.sqlite" --snapshot-id "$PARENT_SNAPSHOT_ID" --contract-out "$RECOVERY_CONTRACT"
            node scripts/build-pages-artifact.mjs --source "$RECOVERY_SOURCE" --out "${RUNNER_TEMP}/recovery-artifact" --source-sha "$HYDRATION_SOURCE_SHA" --snapshot-id "$PARENT_SNAPSHOT_ID" --artifact-contract "$RECOVERY_CONTRACT"
            node scripts/probe-production.mjs --artifact-dir "${RUNNER_TEMP}/recovery-artifact" --source-sha "$HYDRATION_SOURCE_SHA" --snapshot-id "$PARENT_SNAPSHOT_ID" --artifact-contract "$RECOVERY_CONTRACT"
          fi
      - name: Prepare isolated refresh candidate
        shell: bash
        env:
          HYDRATION_SOURCE_SHA: ${{ steps.state.outputs.hydration_source_sha }}
        run: |
          set -euo pipefail
          node scripts/prepare-refresh-candidate.mjs --checkout "$GITHUB_WORKSPACE" --last-good-sha "$HYDRATION_SOURCE_SHA" --out "${RUNNER_TEMP}/candidate"
          cp -a "${RUNNER_TEMP}/candidate" "${RUNNER_TEMP}/candidate-baseline"
          rm -f "${RUNNER_TEMP}/candidate/data/repository-observations.sqlite" "${RUNNER_TEMP}/candidate/data/repository-observations.sqlite-journal" "${RUNNER_TEMP}/candidate/data/repository-observations.sqlite-shm" "${RUNNER_TEMP}/candidate/data/repository-observations.sqlite-wal"
      - name: Freeze one run context and parent evidence
        id: context
        shell: bash
        env:
          HYDRATION_SOURCE_SHA: ${{ steps.state.outputs.hydration_source_sha }}
          PRODUCTION_VERSION: ${{ steps.state.outputs.production_version }}
          PARENT_SNAPSHOT_ID: ${{ steps.state.outputs.parent_snapshot_id }}
        run: |
          set -euo pipefail
          PARENT_CAPTURE_DIR="${RUNNER_TEMP}/frozen-parent-input"
          mkdir "$PARENT_CAPTURE_DIR"
          PARENT_DATABASE="$PARENT_CAPTURE_DIR/repository-observations.sqlite"
          if [ "$PRODUCTION_VERSION" = "1" ]; then
            set -o noclobber
            node scripts/observation-db-store.mjs resolve --source-sha "$HYDRATION_SOURCE_SHA" --expect-snapshot-id "$PARENT_SNAPSHOT_ID" --out "$PARENT_DATABASE"
            chmod 0444 "$PARENT_DATABASE"
            EXPECTED_PARENT="$PARENT_SNAPSHOT_ID"
          else
            [ ! -e "$PARENT_DATABASE" ] || { echo "::error::parent database capture path already exists"; exit 1; }
            EXPECTED_PARENT=none
          fi
          chmod 0555 "$PARENT_CAPTURE_DIR"
          node --input-type=module -e 'import { appendFileSync, writeFileSync } from "node:fs"; import { createRunContext } from "./scripts/run-context.mjs"; const parent=process.env.PRODUCTION_VERSION === "1" ? {snapshotId:process.env.PARENT_SNAPSHOT_ID,sourceSha:process.env.HYDRATION_SOURCE_SHA} : {snapshotId:null,sourceSha:null}; const context=createRunContext(new Date(Number(process.env.REFRESH_ORIGIN_EPOCH_MS)),parent); const encoded=JSON.stringify(context); writeFileSync(process.argv[1],encoded); appendFileSync(process.env.GITHUB_ENV,`RUN_CONTEXT_JSON=${encoded}\n`); appendFileSync(process.env.GITHUB_OUTPUT,`snapshot_id=${context.snapshotId}\n`);' "${RUNNER_TEMP}/run-context.json"
          python scripts/derive_repository_artifacts.py export-parent-inputs --parent-database "$PARENT_DATABASE" --baseline-receipt data/legacy-observation-baseline.json --expected-parent-snapshot "$EXPECTED_PARENT" --production-source-sha "$HYDRATION_SOURCE_SHA" --parent-evidence-out "${RUNNER_TEMP}/parent-evidence.json" --prior-heads-out "${RUNNER_TEMP}/prior-heads.json"
          python scripts/derive_repository_artifacts.py verify-parent-inputs --parent-database "$PARENT_DATABASE" --parent-evidence "${RUNNER_TEMP}/parent-evidence.json" --prior-heads "${RUNNER_TEMP}/prior-heads.json"
          if git cat-file -e "$HYDRATION_SOURCE_SHA:data/observation-db.pointer.json" 2>/dev/null; then
            git show "$HYDRATION_SOURCE_SHA:data/observation-db.pointer.json" > "${RUNNER_TEMP}/parent-pointer.json"
            node --input-type=module -e 'import { readFileSync } from "node:fs"; const pointer=JSON.parse(readFileSync(process.argv[1],"utf8")); const evidence=JSON.parse(readFileSync(process.argv[2],"utf8")); const declared=evidence?.parent_database?.file_sha256; if(typeof declared!=="string"||declared!==pointer?.database?.sha256) throw new Error("pointer.database.sha256 does not match the parent evidence database hash");' "${RUNNER_TEMP}/parent-pointer.json" "${RUNNER_TEMP}/parent-evidence.json"
          fi
          echo "PARENT_DATABASE=$PARENT_DATABASE" >> "$GITHUB_ENV"
      - name: Collect frozen repository facts
        id: facts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/update-trending.mjs --facts-out "${RUNNER_TEMP}/repository-facts.json" --budget-state "${RUNNER_TEMP}/event-budget.json"
          node --input-type=module -e 'import { appendFileSync, readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1],"utf8")); if(!/^[a-f0-9]{64}$/.test(value.sourceSetSha256 ?? "") || !/^[a-f0-9]{64}$/.test(value.runContextSha256 ?? "")) throw new Error("frozen facts binding is invalid"); appendFileSync(process.env.GITHUB_ENV,`FROZEN_SOURCE_SET_SHA256=${value.sourceSetSha256}\nFROZEN_RUN_CONTEXT_SHA256=${value.runContextSha256}\n`);' "${RUNNER_TEMP}/repository-facts.json"
          node --input-type=module -e 'import { appendFileSync, readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1],"utf8")); appendFileSync(process.env.GITHUB_OUTPUT,`source_set_sha256=${value.sourceSetSha256}\nrun_context_sha256=${value.runContextSha256}\n`);' "${RUNNER_TEMP}/repository-facts.json"
      - name: Collect complete repository events
        id: events
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/collect-repository-events.mjs --facts "${RUNNER_TEMP}/repository-facts.json" --events-out "${RUNNER_TEMP}/repository-events.json" --budget-state "${RUNNER_TEMP}/event-budget.json" --prior-heads "${RUNNER_TEMP}/prior-heads.json" --parent-evidence "${RUNNER_TEMP}/parent-evidence.json" --parent-database "$PARENT_DATABASE"
          NOW_MS="$(printf '%s' "$EPOCHREALTIME" | tr -d '.' | cut -c1-13)"
          SUCCESS_PLUS=$(( 10#$NOW_MS + 4200000 ))
          HARD_MINUS=$(( REFRESH_HARD_DEADLINE_EPOCH_MS - 1800000 ))
          if [ "$SUCCESS_PLUS" -lt "$HARD_MINUS" ]; then ENRICHMENT_DEADLINE="$SUCCESS_PLUS"; else ENRICHMENT_DEADLINE="$HARD_MINUS"; fi
          [ "$ENRICHMENT_DEADLINE" -gt "$NOW_MS" ] || { echo "::error::no enrichment budget remains"; exit 1; }
          echo "REFRESH_ENRICHMENT_DEADLINE_EPOCH_MS=$ENRICHMENT_DEADLINE" >> "$GITHUB_ENV"
          echo "ENRICHMENT_DEADLINE_EPOCH_MS=$ENRICHMENT_DEADLINE" >> "$GITHUB_ENV"
          echo "enrichment_deadline_epoch_ms=$ENRICHMENT_DEADLINE" >> "$GITHUB_OUTPUT"
      - name: Upload frozen enrichment input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-input-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate
            ${{ runner.temp }}/repository-facts.json
            ${{ runner.temp }}/repository-events.json
            ${{ runner.temp }}/prior-heads.json
            ${{ runner.temp }}/parent-evidence.json
            ${{ runner.temp }}/frozen-parent-input/repository-observations.sqlite
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Upload recovery artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-artifact
          retention-days: 2

  enrich:
    name: Generate source-bound summaries on Claude OAuth runner
    needs: prepare
    runs-on: [self-hosted, Windows, X64, gh-trending-claude]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.original_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Download frozen enrichment input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: refresh-input-${{ github.run_id }}
          path: ${{ runner.temp }}/refresh-input
      - name: Verify isolated Claude runner checkout
        shell: pwsh
        env:
          ORIGINAL_SHA: ${{ needs.prepare.outputs.original_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:ORIGINAL_SHA) { throw "Claude runner checkout identity mismatch" }
          if ((git status --porcelain=v1).Count -ne 0) { throw "Claude runner checkout is not clean" }
          $root = Join-Path $env:RUNNER_TEMP "refresh-input"
          foreach ($relative in @("candidate", "repository-facts.json", "repository-events.json", "prior-heads.json", "parent-evidence.json")) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $relative))) { throw "Frozen enrichment input is incomplete" }
          }
      - name: Seed approved v0 summary cache
        if: ${{ needs.prepare.outputs.recovery_version == '0' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $seed = Join-Path $env:GITHUB_WORKSPACE "data/bootstrap-summary-seed.json"
          $target = Join-Path $env:RUNNER_TEMP "refresh-input/candidate/data/repo-summaries.json"
          if (-not (Test-Path -LiteralPath $seed -PathType Leaf)) { throw "Approved v0 summary seed is unavailable" }
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "Frozen candidate summary cache is unavailable" }
          Copy-Item -LiteralPath $seed -Destination $target
      - name: Generate bound enrichment with Claude OAuth
        shell: pwsh
        env:
          ENRICHMENT_DEADLINE_EPOCH_MS: ${{ needs.prepare.outputs.enrichment_deadline_epoch_ms }}
          ENRICHMENT_BUDGET_MODE: ${{ needs.prepare.outputs.enrichment_budget_mode }}
          INPUT_SOURCE_SHA: ${{ needs.prepare.outputs.original_sha }}
          VERIFIED_RECOVERY_VERSION: ${{ needs.prepare.outputs.recovery_version }}
          VERIFIED_BOOTSTRAP_SOURCE_SHA: ${{ needs.prepare.outputs.verified_bootstrap_source_sha }}
          MANUAL_BOOTSTRAP_SOURCE_SHA: ${{ needs.prepare.outputs.manual_bootstrap_source_sha }}
          HYDRATION_SOURCE_SHA: ${{ needs.prepare.outputs.recovery_source_sha }}
          FROZEN_SOURCE_SET_SHA256: ${{ needs.prepare.outputs.frozen_source_set_sha256 }}
          FROZEN_RUN_CONTEXT_SHA256: ${{ needs.prepare.outputs.frozen_run_context_sha256 }}
          PRODUCTION_MANIFEST_STATUS: ${{ needs.prepare.outputs.production_manifest_status }}
          PRODUCTION_MANIFEST_SHA256: ${{ needs.prepare.outputs.production_manifest_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $oauthToken = [Environment]::GetEnvironmentVariable("CLAUDE_CODE_OAUTH_TOKEN", "User")
          if ([string]::IsNullOrWhiteSpace($oauthToken)) { throw "Claude OAuth token is unavailable for the runner user" }
          Write-Host "::add-mask::$oauthToken"
          $env:CLAUDE_CODE_OAUTH_TOKEN = $oauthToken
          try {
            $root = Join-Path $env:RUNNER_TEMP "refresh-input"
            $candidate = Join-Path $root "candidate"
            $index = Join-Path $root "enrichment-index.json"
            $parentDatabase = Join-Path $root "frozen-parent-input/repository-observations.sqlite"
            $output = & node scripts/generate-summary-bundles.mjs --facts (Join-Path $root "repository-facts.json") --events (Join-Path $root "repository-events.json") --enrichment-index-out $index --source-root $candidate --output-root $candidate --prior-heads (Join-Path $root "prior-heads.json") --parent-evidence (Join-Path $root "parent-evidence.json") --parent-database $parentDatabase --failure-diagnostics-out (Join-Path $root "enrichment-failure.json")
            if ($LASTEXITCODE -ne 0) { throw "Claude enrichment failed" }
            $receipt = ($output -join "`n")
            Set-Content -LiteralPath (Join-Path $root "enrichment-usage.json") -Value $receipt -Encoding utf8 -NoNewline
            node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1],"utf8")); const usage=value?.usage; const runtime=value?.runtime; const keys=["repositories","pending","held","runtime","usage"]; const usageKeys=["attempts","inputTokens","logicalCalls","outputTokens","retries"]; const runtimeKeys=["api_provider","auth_method","cli_version","interface","model","provider"]; if(Object.keys(value).sort().join("\0")!==keys.sort().join("\0")||!Number.isSafeInteger(value.held)||value.held<0||value.held>value.pending||Object.keys(usage??{}).sort().join("\0")!==usageKeys.sort().join("\0")||Object.values(usage).some(v=>!Number.isSafeInteger(v)||v<0)||Object.keys(runtime??{}).sort().join("\0")!==runtimeKeys.sort().join("\0")||runtime.provider!=="claude-cli-oauth"||runtime.interface!=="claude-p"||runtime.auth_method!=="oauth_token"||runtime.api_provider!=="firstParty"||runtime.model!=="claude-sonnet-5"||!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(runtime.cli_version)) throw new Error("Claude usage receipt is invalid");' (Join-Path $root "enrichment-usage.json")
            if ($LASTEXITCODE -ne 0) { throw "Claude usage receipt is invalid" }
            if ((git status --porcelain=v1).Count -ne 0) { throw "Claude runner changed the tracked checkout" }
            $result = Join-Path $env:RUNNER_TEMP "refresh-enriched"
            New-Item -ItemType Directory -Path (Join-Path $result "data") -Force | Out-Null
            Copy-Item -LiteralPath (Join-Path $candidate "data/repo-summaries.json") -Destination (Join-Path $result "data/repo-summaries.json")
            Copy-Item -LiteralPath (Join-Path $candidate "data/translation-sources.json") -Destination (Join-Path $result "data/translation-sources.json")
            Copy-Item -LiteralPath $index -Destination (Join-Path $result "enrichment-index.json")
            Copy-Item -LiteralPath (Join-Path $root "enrichment-usage.json") -Destination (Join-Path $result "enrichment-usage.json")
            $residue = Join-Path $candidate "translations"
            if ((Test-Path -LiteralPath $residue) -and (Get-ChildItem -LiteralPath $residue -Force).Count -ne 0) { throw "Retired translation residue is present" }
          } finally {
            $env:CLAUDE_CODE_OAUTH_TOKEN = $null
            $oauthToken = $null
          }
      - name: Upload bounded enrichment failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-enrichment-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/refresh-input/enrichment-failure.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload bounded enrichment output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-enriched-${{ github.run_id }}
          path: ${{ runner.temp }}/refresh-enriched
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Validate and publish refresh candidate
    needs: [prepare, enrich]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
      snapshot_id: ${{ needs.prepare.outputs.snapshot_id }}
    env:
      REFRESH_HARD_DEADLINE_EPOCH_MS: ${{ needs.prepare.outputs.refresh_hard_deadline_epoch_ms }}
      REFRESH_TEARDOWN_CUSHION_MS: 300000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.original_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download frozen enrichment input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: refresh-input-${{ github.run_id }}
          path: ${{ runner.temp }}/refresh-input
      - name: Download bounded enrichment output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: refresh-enriched-${{ github.run_id }}
          path: ${{ runner.temp }}/refresh-enriched
      - name: Rebuild and install bounded enrichment candidate
        shell: bash
        env:
          ORIGINAL_SHA: ${{ needs.prepare.outputs.original_sha }}
          HYDRATION_SOURCE_SHA: ${{ needs.prepare.outputs.recovery_source_sha }}
        run: |
          set -euo pipefail
          [ "$ORIGINAL_SHA" = "$(git rev-parse HEAD)" ]
          git diff --quiet --
          git diff --cached --quiet --
          INPUT_ROOT="${RUNNER_TEMP}/refresh-input"
          ENRICHED_ROOT="${RUNNER_TEMP}/refresh-enriched"
          EXPECTED_FILES=$'data/repo-summaries.json\ndata/translation-sources.json\nenrichment-index.json\nenrichment-usage.json'
          ACTUAL_FILES="$(find "$ENRICHED_ROOT" -type f -printf '%P\n' | LC_ALL=C sort)"
          [ "$ACTUAL_FILES" = "$EXPECTED_FILES" ] || { echo "::error::unexpected enrichment artifact residue"; exit 1; }
          [ -z "$(find "$ENRICHED_ROOT" -type l -print -quit)" ] || { echo "::error::enrichment artifact symlink rejected"; exit 1; }
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1],"utf8")); const usage=value?.usage; const runtime=value?.runtime; const keys=["repositories","pending","held","runtime","usage"]; const usageKeys=["attempts","inputTokens","logicalCalls","outputTokens","retries"]; const runtimeKeys=["api_provider","auth_method","cli_version","interface","model","provider"]; if(Object.keys(value).sort().join("\0")!==keys.sort().join("\0")||!Number.isSafeInteger(value.held)||value.held<0||value.held>value.pending||Object.keys(usage??{}).sort().join("\0")!==usageKeys.sort().join("\0")||Object.values(usage).some(v=>!Number.isSafeInteger(v)||v<0)||Object.keys(runtime??{}).sort().join("\0")!==runtimeKeys.sort().join("\0")||runtime.provider!=="claude-cli-oauth"||runtime.interface!=="claude-p"||runtime.auth_method!=="oauth_token"||runtime.api_provider!=="firstParty"||runtime.model!=="claude-sonnet-5"||!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(runtime.cli_version)) throw new Error("Claude usage receipt is invalid");' "$ENRICHED_ROOT/enrichment-usage.json"
          node scripts/prepare-refresh-candidate.mjs --checkout "$GITHUB_WORKSPACE" --last-good-sha "$HYDRATION_SOURCE_SHA" --out "${RUNNER_TEMP}/candidate"
          cp -a "${RUNNER_TEMP}/candidate" "${RUNNER_TEMP}/candidate-baseline"
          rm -f "${RUNNER_TEMP}/candidate/data/repository-observations.sqlite" "${RUNNER_TEMP}/candidate/data/repository-observations.sqlite-journal" "${RUNNER_TEMP}/candidate/data/repository-observations.sqlite-shm" "${RUNNER_TEMP}/candidate/data/repository-observations.sqlite-wal"
          cp "$ENRICHED_ROOT/data/repo-summaries.json" "${RUNNER_TEMP}/candidate/data/repo-summaries.json"
          cp "$ENRICHED_ROOT/data/translation-sources.json" "${RUNNER_TEMP}/candidate/data/translation-sources.json"
          rm -rf "${RUNNER_TEMP}/candidate/translations"
          mkdir "${RUNNER_TEMP}/candidate/translations"
          cp "$INPUT_ROOT/repository-facts.json" "${RUNNER_TEMP}/repository-facts.json"
          cp "$INPUT_ROOT/repository-events.json" "${RUNNER_TEMP}/repository-events.json"
          cp "$INPUT_ROOT/prior-heads.json" "${RUNNER_TEMP}/prior-heads.json"
          cp "$INPUT_ROOT/parent-evidence.json" "${RUNNER_TEMP}/parent-evidence.json"
          cp "$ENRICHED_ROOT/enrichment-index.json" "${RUNNER_TEMP}/enrichment-index.json"
          echo "PARENT_DATABASE=$INPUT_ROOT/frozen-parent-input/repository-observations.sqlite" >> "$GITHUB_ENV"
      - name: Record core repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="${RUNNER_TEMP}/candidate"
          node scripts/update-trending.mjs --render-facts "${RUNNER_TEMP}/repository-facts.json" --events "${RUNNER_TEMP}/repository-events.json" --enrichment-index "${RUNNER_TEMP}/enrichment-index.json" --page-template "$CANDIDATE/index.html" --page-out "${RUNNER_TEMP}/rendered-index.html" --cache-out "${RUNNER_TEMP}/rendered-repo-summaries.json" --snapshot-out "${RUNNER_TEMP}/recorder-snapshot.json"
          python scripts/record_repository_observations.py --parent-database "$PARENT_DATABASE" --candidate-database "$CANDIDATE/data/repository-observations.sqlite" --snapshot "${RUNNER_TEMP}/recorder-snapshot.json" --events "${RUNNER_TEMP}/repository-events.json" --enrichment-index "${RUNNER_TEMP}/enrichment-index.json" --parent-evidence "${RUNNER_TEMP}/parent-evidence.json" --legacy-star-database data/star-observations.sqlite --legacy-membership-database data/trending-membership.sqlite --legacy-public-star-history data/legacy-public-star-history.json --readme-state "$CANDIDATE/data/readme-state.json"
      - name: Derive and render public artifacts
        shell: bash
        env:
          SNAPSHOT_ID: ${{ needs.prepare.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          CANDIDATE="${RUNNER_TEMP}/candidate"
          cp "${RUNNER_TEMP}/rendered-index.html" "$CANDIDATE/index.html"
          cp "${RUNNER_TEMP}/rendered-repo-summaries.json" "$CANDIDATE/data/repo-summaries.json"
          python scripts/derive_repository_artifacts.py derive --database "$CANDIDATE/data/repository-observations.sqlite" --legacy-membership-database data/trending-membership.sqlite --enrichment-index "${RUNNER_TEMP}/enrichment-index.json" --snapshot-id "$SNAPSHOT_ID" --snapshot-export-out "${RUNNER_TEMP}/repository-snapshot-export.json" --membership-status-out "$CANDIDATE/data/membership-status.json" --insights-out "${RUNNER_TEMP}/repository-insights.json"
          node scripts/update-latest-feed.mjs --snapshot-export "${RUNNER_TEMP}/repository-snapshot-export.json" --latest "$CANDIDATE/data/latest.json"
          python scripts/generate_atom_feeds.py --page "$CANDIDATE/index.html" --latest "$CANDIDATE/data/latest.json" --database "$CANDIDATE/data/repository-observations.sqlite" --legacy-membership-database data/trending-membership.sqlite --feed "$CANDIDATE/feed.xml" --changes "$CANDIDATE/changes.xml"
          node scripts/derive-star-anchors.mjs --facts "${RUNNER_TEMP}/repository-facts.json" --out "$CANDIDATE/data/star-anchors.json"
          node scripts/star-ticks.mjs derive --published "$CANDIDATE/data/latest.json" --ticks-dir data/star-ticks --daily data/star-daily.jsonl --anchors "$CANDIDATE/data/star-anchors.json" --out "$CANDIDATE/star-history.json"
      - name: Finalize repository derivatives
        shell: bash
        env:
          SNAPSHOT_ID: ${{ needs.prepare.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          python scripts/derive_repository_artifacts.py finalize --database "${RUNNER_TEMP}/candidate/data/repository-observations.sqlite" --snapshot-id "$SNAPSHOT_ID" --insights "${RUNNER_TEMP}/repository-insights.json" --candidate-root "${RUNNER_TEMP}/candidate"
      - name: Validate whole candidate
        shell: bash
        env:
          SNAPSHOT_ID: ${{ needs.prepare.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          CANDIDATE="${RUNNER_TEMP}/candidate"
          python scripts/derive_repository_artifacts.py verify-pages --database "$CANDIDATE/data/repository-observations.sqlite" --snapshot-id "$SNAPSHOT_ID" --candidate-root "$CANDIDATE" --contract-out "${RUNNER_TEMP}/candidate-artifact-contract.json"
          node scripts/validate-enrichment-coverage.mjs --root "$CANDIDATE" --facts "${RUNNER_TEMP}/repository-facts.json" --json-counts
          python scripts/generate_atom_feeds.py --page "$CANDIDATE/index.html" --latest "$CANDIDATE/data/latest.json" --database "$CANDIDATE/data/repository-observations.sqlite" --legacy-membership-database data/trending-membership.sqlite --feed "$CANDIDATE/feed.xml" --changes "$CANDIDATE/changes.xml" --validate-only
          node scripts/prepare-refresh-candidate.mjs --verify-generated "${RUNNER_TEMP}/candidate-baseline" --candidate "$CANDIDATE"
      - name: Build and probe validated candidate
        shell: bash
        env:
          SNAPSHOT_ID: ${{ needs.prepare.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          PROOF_ROOT="${RUNNER_TEMP}/candidate-proof"
          cp -a "${RUNNER_TEMP}/candidate" "$PROOF_ROOT"
          git -C "$PROOF_ROOT" init -q
          git -C "$PROOF_ROOT" config user.name candidate-proof
          git -C "$PROOF_ROOT" config user.email candidate-proof@example.invalid
          git -C "$PROOF_ROOT" add --all
          git -C "$PROOF_ROOT" commit -qm "candidate proof"
          PROOF_SHA="$(git -C "$PROOF_ROOT" rev-parse HEAD)"
          node scripts/build-pages-artifact.mjs --source "$PROOF_ROOT" --out "${RUNNER_TEMP}/validated-pages-artifact" --source-sha "$PROOF_SHA" --snapshot-id "$SNAPSHOT_ID" --artifact-contract "${RUNNER_TEMP}/candidate-artifact-contract.json"
          (cd "$PROOF_ROOT" && node "$GITHUB_WORKSPACE/scripts/probe-production.mjs" --artifact-dir "${RUNNER_TEMP}/validated-pages-artifact" --source-sha "$PROOF_SHA" --snapshot-id "$SNAPSHOT_ID" --artifact-contract "${RUNNER_TEMP}/candidate-artifact-contract.json")
      - name: Promote and scan staged candidate
        id: publish
        shell: bash
        env:
          ORIGINAL_SHA: ${{ needs.prepare.outputs.original_sha }}
          SNAPSHOT_ID: ${{ needs.prepare.outputs.snapshot_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CANDIDATE="${RUNNER_TEMP}/candidate"
          NOW_MS="$(printf '%s' "$EPOCHREALTIME" | tr -d '.' | cut -c1-13)"
          [ "$NOW_MS" -lt "$(( REFRESH_HARD_DEADLINE_EPOCH_MS - REFRESH_TEARDOWN_CUSHION_MS ))" ] || { echo "::error::refresh teardown cushion reached"; exit 1; }
          git fetch origin main
          [ "$ORIGINAL_SHA" = "$(git rev-parse refs/remotes/origin/main)" ] || { echo "::error::origin/main advanced during refresh"; exit 1; }
          [ "$ORIGINAL_SHA" = "$(git rev-parse HEAD)" ] || { echo "::error::checkout HEAD changed during candidate work"; exit 1; }
          git diff --quiet -- || { echo "::error::tracked checkout bytes changed during candidate work"; exit 1; }
          git diff --cached --quiet -- || { echo "::error::checkout index changed during candidate work"; exit 1; }
          python scripts/scan_repository_observations.py --database "$CANDIDATE/data/repository-observations.sqlite" --expect-snapshot "$SNAPSHOT_ID" > "${RUNNER_TEMP}/scan-receipt.json"
          cp "$CANDIDATE/index.html" index.html
          cp "$CANDIDATE/data/repo-summaries.json" data/repo-summaries.json
          cp "$CANDIDATE/data/readme-state.json" data/readme-state.json
          cp "$CANDIDATE/data/membership-status.json" data/membership-status.json
          cp "$CANDIDATE/data/latest.json" data/latest.json
          cp "$CANDIDATE/data/translation-sources.json" data/translation-sources.json
          cp "$CANDIDATE/feed.xml" feed.xml
          cp "$CANDIDATE/changes.xml" changes.xml
          cp "$CANDIDATE/data/star-anchors.json" data/star-anchors.json
          cp "$CANDIDATE/star-history.json" star-history.json
          rsync --archive --delete "$CANDIDATE/translations/" translations/
          if git ls-files --error-unmatch data/repository-observations.sqlite >/dev/null 2>&1; then
            git rm --cached --quiet data/repository-observations.sqlite
            rm -f data/repository-observations.sqlite
          fi
          git fetch origin main
          [ "$ORIGINAL_SHA" = "$(git rev-parse refs/remotes/origin/main)" ] || { echo "::error::origin/main advanced during refresh"; exit 1; }
          node scripts/observation-db-store.mjs publish --database "$CANDIDATE/data/repository-observations.sqlite" --snapshot-id "$SNAPSHOT_ID" --target-sha "$ORIGINAL_SHA" --latest "$CANDIDATE/data/latest.json" --scan-receipt "${RUNNER_TEMP}/scan-receipt.json" --pointer-out data/observation-db.pointer.json
          changed_paths="$({ git diff --name-only && git diff --cached --name-only && git ls-files --others --exclude-standard; } | sort -u)"
          while IFS= read -r changed_path; do
            [ -z "$changed_path" ] && continue
            case "$changed_path" in
              index.html|data/repo-summaries.json|data/observation-db.pointer.json|data/readme-state.json|data/membership-status.json|data/latest.json|data/translation-sources.json|feed.xml|changes.xml|data/star-anchors.json|star-history.json|translations/*.json|data/repository-observations.sqlite) ;;
              *) echo "::error::Unexpected generated output: $changed_path"; exit 1 ;;
            esac
          done <<< "$changed_paths"
          git add -- index.html data/repo-summaries.json data/observation-db.pointer.json data/readme-state.json data/membership-status.json data/latest.json data/translation-sources.json feed.xml changes.xml data/star-anchors.json star-history.json translations/
          if git diff --cached --quiet; then
            echo "::error::version-1 refresh requires one nonempty generated child"
            exit 1
          fi
          set +e
          git grep --cached -qE '(sk-ant-[[:alnum:]_-]{20,}|gh[pousr]_[[:alnum:]_]{20,}|github_pat_[[:alnum:]_]{20,}|AIza[[:alnum:]_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- index.html data/repo-summaries.json data/observation-db.pointer.json data/readme-state.json data/membership-status.json data/latest.json data/translation-sources.json feed.xml changes.xml data/star-anchors.json star-history.json translations/
          SCAN_STATUS=$?
          set -e
          case "$SCAN_STATUS" in
            0) echo "::error::Potential secret detected in generated text outputs"; exit 1 ;;
            1) ;;
            *) echo "::error::Staged text secret scan failed"; exit 1 ;;
          esac
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh trending snapshot"
          SOURCE_SHA="$(git rev-parse HEAD)"
          [ "$SOURCE_SHA" != "$ORIGINAL_SHA" ]
          [ "$(git rev-parse "${SOURCE_SHA}^")" = "$ORIGINAL_SHA" ]
          git fetch origin main
          [ "$ORIGINAL_SHA" = "$(git rev-parse refs/remotes/origin/main)" ] || { echo "::error::origin/main advanced during refresh"; exit 1; }
          git push origin HEAD:main
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Publish generated child commit
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.publish.outputs.source_sha }}" = "$(git rev-parse HEAD)" ]
      - name: Build and locally probe committed Pages artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.publish.outputs.source_sha }}
          SNAPSHOT_ID: ${{ needs.prepare.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          PAGES_SOURCE="${RUNNER_TEMP}/pages-source"
          mkdir "$PAGES_SOURCE"
          git archive --format=tar "$SOURCE_SHA" | tar -x -C "$PAGES_SOURCE"
          rm -f "$PAGES_SOURCE/data/repository-observations.sqlite"
          node scripts/observation-db-store.mjs resolve --source-sha "$SOURCE_SHA" --expect-snapshot-id "$SNAPSHOT_ID" --out "$PAGES_SOURCE/data/repository-observations.sqlite"
          cmp "$PAGES_SOURCE/data/repository-observations.sqlite" "${RUNNER_TEMP}/candidate/data/repository-observations.sqlite"
          python scripts/derive_repository_artifacts.py export-contract --database "$PAGES_SOURCE/data/repository-observations.sqlite" --snapshot-id "$SNAPSHOT_ID" --contract-out "${RUNNER_TEMP}/committed-artifact-contract.json"
          node scripts/build-pages-artifact.mjs --source "$PAGES_SOURCE" --out "${RUNNER_TEMP}/pages-artifact" --source-sha "$SOURCE_SHA" --snapshot-id "$SNAPSHOT_ID" --artifact-contract "${RUNNER_TEMP}/committed-artifact-contract.json"
          node scripts/probe-production.mjs --artifact-dir "${RUNNER_TEMP}/pages-artifact" --source-sha "$SOURCE_SHA" --snapshot-id "$SNAPSHOT_ID" --artifact-contract "${RUNNER_TEMP}/committed-artifact-contract.json"
      - name: Upload published observation database copy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observation-db-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate/data/repository-observations.sqlite
          if-no-files-found: error
          retention-days: 30
      - name: Upload candidate Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/pages-artifact
          retention-days: 7

  deploy:
    name: Deploy candidate Pages artifact
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages-candidate-${{ github.run_id }}

  verify:
    name: Probe production candidate
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Resolve observation database
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/repository-observations.sqlite"
          node scripts/observation-db-store.mjs resolve --source-sha "$(git rev-parse HEAD)" --expect-snapshot-id "${{ needs.publish.outputs.snapshot_id }}" --out "${RUNNER_TEMP}/repository-observations.sqlite"
      - name: Probe production candidate
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT="${RUNNER_TEMP}/production-artifact-contract.json"
          python scripts/derive_repository_artifacts.py export-contract --database "${RUNNER_TEMP}/repository-observations.sqlite" --snapshot-id "${{ needs.publish.outputs.snapshot_id }}" --contract-out "$CONTRACT"
          node scripts/probe-production.mjs --base-url "$PRODUCTION_BASE_URL" --source-sha "${{ needs.publish.outputs.source_sha }}" --snapshot-id "${{ needs.publish.outputs.snapshot_id }}" --artifact-contract "$CONTRACT"

  recovery:
    name: Recover prior Pages artifact
    needs: [prepare, publish, deploy, verify]
    if: ${{ always() && needs.verify.result == 'failure' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    timeout-minutes: 120
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: recovery-deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages-recovery-${{ github.run_id }}
      - name: Verify recovered production
        shell: bash
        env:
          RECOVERY_VERSION: ${{ needs.prepare.outputs.recovery_version }}
          RECOVERY_SOURCE_SHA: ${{ needs.prepare.outputs.recovery_source_sha }}
          RECOVERY_SNAPSHOT_ID: ${{ needs.prepare.outputs.recovery_snapshot_id }}
        run: |
          set -euo pipefail
          if [ "$RECOVERY_VERSION" = "0" ]; then
            node scripts/probe-production.mjs --base-url "$PRODUCTION_BASE_URL" --legacy-recovery-sha "$RECOVERY_SOURCE_SHA"
          else
            node scripts/probe-production.mjs --base-url "$PRODUCTION_BASE_URL" --source-sha "$RECOVERY_SOURCE_SHA" --snapshot-id "$RECOVERY_SNAPSHOT_ID"
          fi
