name: Trending refresh (2 hours)

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: npm ci
      - name: Test before refresh
        run: npm test
      - name: Generate complete trending snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/update-trending.mjs
          node scripts/generate-translations.mjs
          python scripts/record_star_observations.py
          node scripts/update-latest-feed.mjs
          node scripts/update-star-history.mjs
      - name: Validate complete trending snapshot
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { extractRepos } from "./scripts/update-star-history.mjs";
          await import("./star-history.js");
          const repos = extractRepos(await readFile("index.html", "utf8"));
          const cache = globalThis.StarHistory.normalizeCache(
            JSON.parse(await readFile("star-history.json", "utf8")),
          );
          assert.deepEqual(
            [...cache.keys()].map(slug => slug.toLowerCase()).sort(),
            repos.map(repo => repo.slug.toLowerCase()).sort(),
          );
          NODE
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from scripts.record_star_observations import (
              parse_legacy_star_history,
              parse_repositories,
              validate_canonical_legacy_baseline,
          )

          page = Path("index.html").read_text(encoding="utf-8")
          repositories = parse_repositories(page)
          parse_legacy_star_history(page)
          database = Path("data/star-observations.sqlite")
          validate_canonical_legacy_baseline(database)
          with sqlite3.connect(database) as connection:
              connection.execute("PRAGMA foreign_keys = ON")
              assert connection.execute("PRAGMA integrity_check").fetchone() == ("ok",)
              assert connection.execute("PRAGMA foreign_key_check").fetchall() == []
              for repository in repositories:
                  assert connection.execute(
                      "SELECT 1 FROM star_observations "
                      "WHERE slug = ? COLLATE NOCASE AND observed_date = ? AND source = 'github_rest'",
                      (repository.slug, repository.observed_date),
                  ).fetchone() == (1,)
          for sidecar in (
              Path("data/star-observations.sqlite-journal"),
              Path("data/star-observations.sqlite-wal"),
              Path("data/star-observations.sqlite-shm"),
          ):
              assert not sidecar.exists(), f"SQLite sidecar remains: {sidecar.name}"
          PY
          npm test
          git diff --check -- index.html data/repo-summaries.json data/star-observations.sqlite star-history.json data/latest.json data/translation-sources.json translations/
      - name: Publish validated snapshot
        shell: bash
        run: |
          set -euo pipefail
          changed_paths="$({ git diff --name-only && git ls-files --others --exclude-standard; } | sort -u)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              index.html|data/repo-summaries.json|data/star-observations.sqlite|star-history.json|data/latest.json|data/translation-sources.json) ;;
              translations/*.json) ;;
              *) echo "::error::Unexpected generated output"; exit 1 ;;
            esac
          done <<< "$changed_paths"
          git add -- index.html data/repo-summaries.json data/star-observations.sqlite star-history.json data/latest.json data/translation-sources.json translations/
          set +e
          git diff --cached --quiet -- index.html data/repo-summaries.json data/star-observations.sqlite star-history.json data/latest.json data/translation-sources.json translations/
          diff_status=$?
          set -e
          case "$diff_status" in
            0) exit 0 ;;
            1) ;;
            *) echo "::error::Generated diff check failed"; exit 1 ;;
          esac
          set +e
          git grep --cached -qE '(gh[pousr]_[[:alnum:]_]{20,}|github_pat_[[:alnum:]_]{20,}|AIza[[:alnum:]_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- index.html data/repo-summaries.json data/star-observations.sqlite star-history.json data/latest.json data/translation-sources.json translations/
          scan_status=$?
          set -e
          case "$scan_status" in
            0) echo "::error::Potential secret detected in generated outputs"; exit 1 ;;
            1) ;;
            *) echo "::error::Secret scan failed"; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh trending snapshot"
          git push origin HEAD:main
