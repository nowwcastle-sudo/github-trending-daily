name: Retry an unacquired refresh

# A scheduled refresh can fail without ever running: the self-hosted runner stays online but its
# acquirejob request times out, so no step starts and the server cancels the job after ~14 minutes.
# That loses a whole six-hour cycle to a transient network fault. This workflow dispatches one
# replacement run for exactly that failure shape, and for nothing else.

on:
  workflow_run:
    workflows: ["Trending refresh (every 6 hours)"]
    types: [completed]

permissions: {}

concurrency:
  group: refresh-retry
  cancel-in-progress: false

jobs:
  retry:
    # Only a scheduled cycle is retried. The replacement is a workflow_dispatch run, so it can never
    # satisfy this condition itself: at most one retry per scheduled cycle, and a failing retry stays
    # failed and visible.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Dispatch one replacement only when the enrichment job never started
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_REF: ${{ github.event.workflow_run.head_branch }}
          ENRICH_JOB_NAME: Generate source-bound summaries
        run: |
          set -euo pipefail
          jobs_file="${RUNNER_TEMP}/failed-run-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/jobs?per_page=100" > "$jobs_file"
          enrich=$(jq -c --arg name "$ENRICH_JOB_NAME" '[.jobs[] | select(.name == $name)] | first // empty' "$jobs_file")
          if [ -z "$enrich" ]; then
            echo "::error::job \"${ENRICH_JOB_NAME}\" is absent from run ${FAILED_RUN_ID}; the guard is stale and must be fixed before it can retry anything"
            exit 1
          fi
          conclusion=$(printf '%s' "$enrich" | jq -r '.conclusion // ""')
          runner_name=$(printf '%s' "$enrich" | jq -r '.runner_name // ""')
          started_steps=$(printf '%s' "$enrich" | jq '[.steps[]? | select(.status != "queued" and .status != "pending")] | length')
          echo "conclusion=${conclusion} runner=[${runner_name}] started_steps=${started_steps}"
          # The signature of a lost job: cancelled, no runner ever recorded, not one step started.
          # Every other failure is a real one - bad source data, a contract breach, a failing gate -
          # and repeating it would only hide it.
          if [ "$conclusion" != "cancelled" ] || [ -n "$runner_name" ] || [ "$started_steps" -ne 0 ]; then
            echo "::notice::run ${FAILED_RUN_ID} failed after the job was acquired; leaving it failed to be read"
            exit 0
          fi
          echo "::notice::run ${FAILED_RUN_ID} lost its job before any step ran; dispatching one replacement refresh on ${TARGET_REF}"
          gh workflow run daily-refresh.yml --ref "$TARGET_REF"
