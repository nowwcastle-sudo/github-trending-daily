name: Retry an unacquired refresh

# A scheduled refresh can fail without its enrichment job ever running a step, and then nothing the
# refresh did can be the cause. Two such shapes are known. The self-hosted runner stays online but
# its acquirejob request times out, so the server cancels the job after ~14 minutes. Or the runner
# acquires the job on a starved host, cannot hand it to its own worker process within the ~30
# seconds it allows, kills that worker, and GitHub reports the runner lost (twice on 2026-09-17).
# Either way a whole six-hour cycle goes to a transient fault. This workflow dispatches one
# replacement run for exactly those shapes, and for nothing else.

on:
  workflow_run:
    workflows: ["Trending refresh (every 6 hours)"]
    types: [completed]

permissions: {}

concurrency:
  group: refresh-retry
  cancel-in-progress: false

jobs:
  retry:
    # Only a scheduled cycle is retried. The replacement is a workflow_dispatch run, so it can never
    # satisfy this condition itself: at most one retry per scheduled cycle, and a failing retry stays
    # failed and visible. A cancelled cycle counts too: when acquirejob answers 409 "already acquired"
    # after losing its first response (2026-09-23), the job stays queued until the queue guard cancels
    # the run at its deadline. The step below still retries only an enrichment job that ran no step.
    # ponytail: a scheduled run cancelled by hand while enrichment is queued also gets one replacement.
    if: ${{ (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled') && github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Dispatch one replacement only when the enrichment job ran no step
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_REF: ${{ github.event.workflow_run.head_branch }}
          ENRICH_JOB_NAME: Generate source-bound summaries
        run: |
          set -euo pipefail
          jobs_file="${RUNNER_TEMP}/failed-run-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/jobs?per_page=100" > "$jobs_file"
          enrich=$(jq -c --arg name "$ENRICH_JOB_NAME" '[.jobs[] | select(.name == $name)] | first // empty' "$jobs_file")
          if [ -z "$enrich" ]; then
            echo "::error::job \"${ENRICH_JOB_NAME}\" is absent from run ${FAILED_RUN_ID}; the guard is stale and must be fixed before it can retry anything"
            exit 1
          fi
          conclusion=$(printf '%s' "$enrich" | jq -r '.conclusion // ""')
          runner_name=$(printf '%s' "$enrich" | jq -r '.runner_name // ""')
          started_steps=$(printf '%s' "$enrich" | jq '[.steps[]? | select(.status != "queued" and .status != "pending")] | length')
          echo "conclusion=${conclusion} runner=[${runner_name}] started_steps=${started_steps}"
          # Every failure that ran even one step is a real one - bad source data, a contract breach, a
          # failing gate - and repeating it would only hide it.
          if [ "$started_steps" -ne 0 ]; then
            echo "::notice::run ${FAILED_RUN_ID} failed after the enrichment job ran a step; leaving it failed to be read"
            exit 0
          fi
          # With no step run, the two known shapes are told apart by whether a runner was recorded.
          # Anything else - skipped because prepare failed, or a conclusion not seen before - is left
          # alone rather than guessed at.
          if [ "$conclusion" = "cancelled" ] && [ -z "$runner_name" ]; then
            reason="lost its job before any step ran"
          elif [ "$conclusion" = "failure" ] && [ -n "$runner_name" ]; then
            reason="lost runner ${runner_name} before any step ran"
          else
            echo "::notice::run ${FAILED_RUN_ID} enrichment ended ${conclusion:-with no conclusion} on runner [${runner_name}] with no step run; not a shape this retries, leaving it failed to be read"
            exit 0
          fi
          echo "::notice::run ${FAILED_RUN_ID} ${reason}; dispatching one replacement refresh on ${TARGET_REF}"
          # --repo is required: this job has no checkout, so gh has no git remote to infer a repository
          # from and exits "not a git repository". Without it this dispatch could never have succeeded,
          # and nothing showed that, because no run had ever reached this line.
          gh workflow run daily-refresh.yml --ref "$TARGET_REF" --repo "$GITHUB_REPOSITORY"
