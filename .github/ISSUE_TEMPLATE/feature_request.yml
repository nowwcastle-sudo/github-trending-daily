name: Feature request
description: Suggest a capability for GITHUB INSIGHT
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
      description: What are you trying to do, and where does the current dashboard get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of GITHUB INSIGHT does this affect?
      options:
        - Sidebar/Filters
        - Star history
        - Atom feeds
        - Summaries/README
        - Locales
        - Other
      default: 5
    validations:
      required: false
